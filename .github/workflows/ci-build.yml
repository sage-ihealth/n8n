# =============================================================================
# iHealth Labs — n8n CI/CD
# Triggers: push to master → build → push to Docker Hub ihealthlabs/n8n
# =============================================================================
name: Build & Push Docker Image

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  IMAGE: ihealthlabs/n8n
  REGISTRY: docker.io

jobs:
  build-and-push:
    name: Build iHealth n8n
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set build metadata
        id: meta
        run: |
          SHA=$(echo "${{ github.sha }}" | head -c 8)
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "sha=${SHA}" >> $GITHUB_OUTPUT
          echo "date=${DATE}" >> $GITHUB_OUTPUT
          echo "tag=m-${SHA}" >> $GITHUB_OUTPUT
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/images/n8n-ihealth/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          build-args: |
            N8N_VERSION=${{ steps.meta.outputs.version }}
            BUILD_SHA=${{ steps.meta.outputs.sha }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Trigger ArgoCD deployment
        env:
          ARGOCD_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${ARGOCD_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://argocd-sunnyvale.ihealth-eng.com/api/v1/applications/n8n-sage-dev/sync" \
            -d '{"revision": "HEAD"}' || true
          echo "Deployed: ihealthlabs/n8n:${IMAGE_TAG}"

      - name: Summary
        run: |
          echo "## ✅ Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`ihealthlabs/n8n:${{ steps.meta.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`${{ steps.meta.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **SHA** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **URL** | https://n8n-sage.ihealth-eng.com |" >> $GITHUB_STEP_SUMMARY
